<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cherry Studio 调用链错误排查流程</title>
  <desc id="desc">启用开发者模式并重启，重现失败请求，在调用链中选择失败的 HTTP 请求并查看输出。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5b6475" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ff5f5f"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="28" fill="#f7f8fa"/>
  <text x="60" y="68" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#20242c">通过调用链查看请求与错误详情</text>
  <text x="60" y="106" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#6d7480">V2 的模型请求由客户端主进程执行，请使用内置调用链进行排查</text>

  <g filter="url(#shadow)">
    <rect x="60" y="140" width="1080" height="470" rx="20" fill="#fff" stroke="#e3e6eb"/>
    <rect x="60" y="140" width="1080" height="54" rx="20" fill="#eef1f5"/>
    <circle cx="92" cy="167" r="7" fill="#ff6b6b"/>
    <circle cx="116" cy="167" r="7" fill="#ffc857"/>
    <circle cx="140" cy="167" r="7" fill="#55c982"/>
    <text x="178" y="174" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#596170">Cherry Studio</text>

    <rect x="84" y="220" width="252" height="354" rx="14" fill="#fafbfc" stroke="#e3e6eb"/>
    <text x="108" y="258" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#20242c">设置</text>
    <text x="108" y="300" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#6d7480">外观</text>
    <text x="108" y="338" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#6d7480">通知</text>
    <rect x="100" y="360" width="220" height="46" rx="10" fill="#fff0f0"/>
    <text x="108" y="390" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#e83f4a">系统</text>
    <text x="108" y="446" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#20242c">启用开发者模式</text>
    <rect x="252" y="426" width="54" height="30" rx="15" fill="#4fca84"/>
    <circle cx="290" cy="441" r="12" fill="#fff"/>
    <rect x="100" y="486" width="220" height="56" rx="10" fill="#fff7e6" stroke="#ffc857"/>
    <text x="118" y="510" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#8a5a00">更改后请完全退出</text>
    <text x="118" y="532" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#8a5a00">并重新启动应用</text>

    <rect x="360" y="220" width="340" height="354" rx="14" fill="#fafbfc" stroke="#e3e6eb"/>
    <text x="384" y="258" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#20242c">调用链</text>
    <text x="384" y="290" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#8a919d">重现错误后选择标红节点</text>
    <line x1="410" y1="330" x2="410" y2="506" stroke="#d9dde5" stroke-width="3"/>

    <circle cx="410" cy="344" r="13" fill="#55c982"/>
    <text x="440" y="351" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#20242c">ai.turn</text>
    <circle cx="410" cy="406" r="13" fill="#55c982"/>
    <text x="440" y="413" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#20242c">streamText</text>
    <rect x="388" y="446" width="286" height="58" rx="10" fill="#fff0f0" stroke="#ff5f5f" stroke-width="2"/>
    <circle cx="410" cy="475" r="13" fill="#e83f4a"/>
    <path d="M404 469L416 481M416 469L404 481" stroke="#fff" stroke-width="2"/>
    <text x="440" y="471" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#c92f3b">http.request</text>
    <text x="440" y="493" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#c92f3b">401 Unauthorized</text>

    <rect x="724" y="220" width="392" height="354" rx="14" fill="#fafbfc" stroke="#e3e6eb"/>
    <text x="748" y="258" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#20242c">节点详情</text>
    <text x="748" y="294" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#6d7480">响应状态</text>
    <text x="852" y="294" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#e83f4a">401 Unauthorized</text>

    <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">
      <rect x="748" y="320" width="70" height="36" rx="8" fill="#fff" stroke="#e3e6eb"/>
      <text x="766" y="343" fill="#596170">输入</text>
      <rect x="828" y="320" width="70" height="36" rx="8" fill="#fff0f0" stroke="#ff5f5f" stroke-width="2"/>
      <text x="846" y="343" font-weight="700" fill="#e83f4a">输出</text>
      <rect x="908" y="320" width="88" height="36" rx="8" fill="#fff" stroke="#e3e6eb"/>
      <text x="924" y="343" fill="#596170">响应头</text>
      <rect x="1006" y="320" width="70" height="36" rx="8" fill="#fff" stroke="#e3e6eb"/>
      <text x="1024" y="343" fill="#596170">原始</text>
    </g>

    <rect x="748" y="376" width="328" height="142" rx="10" fill="#fff" stroke="#e3e6eb"/>
    <text x="770" y="410" font-family="Consolas, monospace" font-size="15" fill="#c92f3b">401 Unauthorized</text>
    <text x="770" y="444" font-family="Consolas, monospace" font-size="15" fill="#596170">{</text>
    <text x="790" y="472" font-family="Consolas, monospace" font-size="15" fill="#596170">"error": "Invalid API key"</text>
    <text x="770" y="500" font-family="Consolas, monospace" font-size="15" fill="#596170">}</text>
    <text x="748" y="548" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#8a919d">字段以服务商实际返回内容为准</text>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#596170">
    <circle cx="130" cy="662" r="22" fill="#eb6262"/><text x="125" y="668" font-weight="700" fill="#fff">1</text>
    <text x="166" y="668">启用开发者模式并重启</text>
    <line x1="340" y1="662" x2="400" y2="662" stroke="#ff5f5f" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="450" cy="662" r="22" fill="#eb6262"/><text x="445" y="668" font-weight="700" fill="#fff">2</text>
    <text x="486" y="668">重现错误并打开调用链</text>
    <line x1="682" y1="662" x2="742" y2="662" stroke="#ff5f5f" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="792" cy="662" r="22" fill="#eb6262"/><text x="787" y="668" font-weight="700" fill="#fff">3</text>
    <text x="828" y="668">选择失败节点，查看输出</text>
  </g>
</svg>
