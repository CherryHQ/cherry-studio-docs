<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Cherry Studio 控制台错误排查流程</title>
  <desc id="desc">依次打开开发者工具、选择 Network、选择失败请求并查看 Response。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5b6475" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ff5f5f"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f7f8fa"/>
  <text x="60" y="70" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#20242c">查看请求的完整错误信息</text>
  <text x="60" y="108" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#6d7480">先打开控制台，再重新执行失败的对话、模型检测、知识库创建或绘画操作</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="1080" height="390" rx="20" fill="#fff" stroke="#e3e6eb"/>
    <rect x="60" y="150" width="1080" height="54" rx="20" fill="#eef1f5"/>
    <circle cx="92" cy="177" r="7" fill="#ff6b6b"/>
    <circle cx="116" cy="177" r="7" fill="#ffc857"/>
    <circle cx="140" cy="177" r="7" fill="#55c982"/>
    <text x="178" y="184" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#596170">Developer Tools</text>

    <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">
      <text x="92" y="244" fill="#596170">Elements</text>
      <text x="182" y="244" fill="#596170">Console</text>
      <rect x="262" y="216" width="104" height="42" rx="10" fill="#fff0f0" stroke="#ff5f5f" stroke-width="2"/>
      <text x="282" y="244" font-weight="700" fill="#e83f4a">Network</text>
      <text x="392" y="244" fill="#596170">Sources</text>
    </g>

    <rect x="88" y="286" width="280" height="224" rx="14" fill="#fafbfc" stroke="#e3e6eb"/>
    <text x="110" y="320" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#6d7480">Name</text>
    <rect x="104" y="344" width="248" height="54" rx="10" fill="#fff0f0" stroke="#ff5f5f" stroke-width="2"/>
    <circle cx="128" cy="371" r="10" fill="#e83f4a"/>
    <path d="M123 366L133 376M133 366L123 376" stroke="#fff" stroke-width="2"/>
    <text x="150" y="378" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#c92f3b">completions</text>
    <text x="110" y="435" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#8a919d">也可能是 embeddings</text>
    <text x="110" y="463" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#8a919d">或 generations</text>

    <rect x="396" y="286" width="716" height="224" rx="14" fill="#fafbfc" stroke="#e3e6eb"/>
    <text x="426" y="326" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#6d7480">Headers</text>
    <rect x="510" y="300" width="112" height="40" rx="10" fill="#fff0f0" stroke="#ff5f5f" stroke-width="2"/>
    <text x="531" y="326" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#e83f4a">Response</text>
    <text x="648" y="326" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#6d7480">Timing</text>
    <rect x="424" y="360" width="660" height="122" rx="10" fill="#fff" stroke="#e3e6eb"/>
    <text x="450" y="402" font-family="Consolas, monospace" font-size="17" fill="#c92f3b">401 Unauthorized</text>
    <text x="450" y="438" font-family="Consolas, monospace" font-size="16" fill="#596170">{"error":"Invalid API key"}</text>
  </g>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <circle cx="175" cy="580" r="22" fill="#ff5f5f"/><text x="175" y="587" font-size="20" font-weight="700" fill="#fff">1</text>
    <text x="224" y="587" text-anchor="start" font-size="17" fill="#303640">打开控制台</text>
    <path d="M350 580H405" stroke="#ff5f5f" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="460" cy="580" r="22" fill="#ff5f5f"/><text x="460" y="587" font-size="20" font-weight="700" fill="#fff">2</text>
    <text x="509" y="587" text-anchor="start" font-size="17" fill="#303640">选择 Network</text>
    <path d="M660 580H715" stroke="#ff5f5f" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="770" cy="580" r="22" fill="#ff5f5f"/><text x="770" y="587" font-size="20" font-weight="700" fill="#fff">3</text>
    <text x="819" y="587" text-anchor="start" font-size="17" fill="#303640">点击红色失败请求</text>
    <path d="M1004 580H1042" stroke="#ff5f5f" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="1092" cy="580" r="22" fill="#ff5f5f"/><text x="1092" y="587" font-size="20" font-weight="700" fill="#fff">4</text>
  </g>
</svg>
